<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtual Desktop</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;


    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #0f0;
      font-size: 1.5rem;
    }

    #desktop {
      display: none;
      width: 100%;
      height: 100vh;
      background-image: url('Fond%20du%20Lac,%20Wi/Terminal/FDL,%20WI/fdl%20wi%20art_9.png');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .folder {
      position: absolute;
      width: 80px;
      text-align: center;
      color: white;
      cursor: pointer;
      touch-action: manipulation;
    }

    .folder img {
      width: 100%;
      height: auto;
    }

    .folder span {
      display: block;
      margin-top: 4px;
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.5);
    }

    #back-button {
    display: none;
    position: absolute;
    top: 20px;
    left: 20px;
    
  }
  #session-timer {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(0, 0, 0, 0.8);
  color: #0f0;
  padding: 10px 15px;
  border-radius: 8px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  border: 1px solid #0f0;
  box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
  z-index: 20;
}

#session-timer .timer-label {
  font-size: 14px;
  margin-bottom: 4px;
  letter-spacing: 1px;
}

#session-timer .timer-countdown {
  font-size: 14px;
  font-weight: normal;
}


#session-expired-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #0f0;
  z-index: 1000;
}

.expired-message {
  text-align: center;
  font-family: 'Courier New', Courier, monospace;
}

.expired-message h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

  </style>
</head>
<body>
  <div id="loading">Loading...</div>

  <div id="desktop">
  <div class="folder" style="top: 100px; left: 100px;" onclick="window.location.href='fdl-av.html'" role="button" tabindex="0" aria-label="Open Fond du Lac, Wi AV">
    <img src="icons8-mac-folder-48.png" alt="Folder icon for Fond du Lac, Wi AV" />
    <span>Fond du Lac, Wi AV</span>
  </div>

    
  <div id="terminal-folder" class="folder" style="top: 100px; left: 220px;" onclick="window.location.href='fdl-terminal.html'" role="button" tabindex="0" aria-label="Open Terminal folder">
    <img src="icons8-mac-folder-48.png" alt="Folder icon for Terminal" />
    <span>Terminal</span>
  </div>

 <!-- <div class="folder" style="top: 100px; left: 340px;" onclick="window.location.href='nyshow.html'" role="button" tabindex="0" aria-label="Open NY Show Flyer">
  <img src="icons8-mac-folder-48.png" alt="Folder icon for NY Show" />
  <span>Anseriform Viewing NY</span>
</div> -->

    <div id="session-timer">
        <div class="timer-label">Trial Ends In:</div>
        <div class="timer-countdown">loading...</div>
      </div>


<div id="session-expired-overlay" style="display: none;">
  <div class="expired-message">
    <h1>Trial Session Is Up</h1>
    <p>guess nothing lasts forever <br> i have to go now</p>
  </div>
</div>

  <button id="back-button">Back</button>

  <script>
    window.EXPIRY_DATE = new Date('2025-12-17T23:59:59');
    window.bypassed = false;

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('bypassed') === '1') {
      window.bypassed = true;
      window.EXPIRY_DATE = new Date();
      window.EXPIRY_DATE.setFullYear(window.EXPIRY_DATE.getFullYear() + 1);
    }

    window.onload = () => {
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('desktop').style.display = 'block';
    
        const input = document.getElementById('command');
        if (input) {
          input.focus();
          document.addEventListener('keydown', () => {
            if (document.activeElement !== input) {
              input.focus();
            }
          });
        }
            
        const terminalFolder = document.getElementById('terminal-folder');
        if (terminalFolder) {
          terminalFolder.addEventListener('click', (e) => {
            e.preventDefault();
               
            console.log('Click detected: sending postMessage to parent');
                     
              window.location.href = 'fdl-terminal.html';
          
          });
        } else {
          console.warn('Terminal folder not found shawty');
        }
      }, 1500);
    };

    window.addEventListener('DOMContentLoaded', () => {
    const backBtn = document.getElementById('back-button');
    if (backBtn) {
      backBtn.addEventListener('click', () => {
        window.parent.postMessage({ action: 'goBack' }, '*');
        console.log('Back button clicked: sent goBack message');
      });
    } else {
      console.warn('Back button not found shordee');
    }
  });
  
window.addEventListener('message', (event) => {
    if (event.data.action === 'openStickynote') {
        setTimeout(() => {
            openStickynote();
        }, 1500);
    }

    if (event.data.action === "updateTimerNow") {
        updateTimer();
    }
}); 

function openStickynote() {
  
  alert('Sticky note triggered shawty'); 
}

let hasExpired = false;
let countdownEl = null;
let overlayEl = null;
let goodbyeCSS = null;

(function() {
  
  const timerEl = document.getElementById('session-timer');
  const countdownEl = document.querySelector('#session-timer .timer-countdown');
  const overlayEl = document.getElementById('session-expired-overlay');

  function formatTime(totalSeconds) {
    const days = Math.floor(totalSeconds / (3600 * 24));
    const hours = Math.floor((totalSeconds % (3600 * 24)) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = Math.floor(totalSeconds % 60);

    return `${days}d ${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
  }

    function disableDesktop() {
      if (bypassed) return; 
      document.querySelectorAll('button, a').forEach(el => {
        el.disabled = true;
        el.style.pointerEvents = 'none';
        el.style.opacity = '0.5';
      });
      overlayEl.style.display = 'flex';
      window.parent.postMessage({ action: 'sessionExpired' }, '*');
    }

function updateTimer() {
  if (!countdownEl || !overlayEl) return;

  if (window.bypassed) { 
    countdownEl.textContent = "∞";
    overlayEl.style.display = "none";
    return;
  }

  const now = new Date();
  let remainingSeconds = Math.floor((window.EXPIRY_DATE - now) / 1000);

  if (remainingSeconds <= 0) {
    hasExpired = true;
    countdownEl.textContent = "00:00:00:00";
    disableDesktop();
    clearInterval(window.sessionTimerInterval);
    return;
  }

  countdownEl.textContent = formatTime(remainingSeconds);
}

    updateTimer();
    window.sessionTimerInterval = setInterval(updateTimer, 1000);

    window.addEventListener("message", (event) => {
  if (event.data.action === "bypassExpiry") {
    bypassed = true;
    hasExpired = false;

    if (overlayEl) overlayEl.style.display = "none";
    if (countdownEl) countdownEl.textContent = "∞";

    clearInterval(window.sessionTimerInterval);

    console.log("Expiry bypassed via res");
  }
});

  })();

function resurrect() {
    console.log("Resurrection triggered");

    if (window.sessionTimerInterval) {
      clearInterval(window.sessionTimerInterval);
    }

    if (window.showIframe && window.removeIframeAndStickyNote) {
        window.removeIframeAndStickyNote();
        bypassed = true;
        overlayEl.style.display = "none";
        EXPIRY_DATE = new Date();
        EXPIRY_DATE.setFullYear(EXPIRY_DATE.getFullYear() + 1);
        console.log("Resurrected! New expiry:", EXPIRY_DATE.toISOString());
        window.showIframe();
    }
}

    </script>
    
    
</body>
</html>
